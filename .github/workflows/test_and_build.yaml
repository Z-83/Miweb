name: Test and build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test_and_build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ -f src/requirements.txt ]; then
            python -m pip install -r src/requirements.txt
          fi
          python -m pip install flake8 pytest

      - name: Run lint
        shell: bash
        run: |
          if find . -name '*.py' -not -path './.git/*' | grep -q .; then
            python -m flake8 .
          else
            echo "No Python files found; skipping lint."
          fi

      - name: Run tests
        shell: bash
        run: |
          if find . -iname 'test_*.py' -o -iname '*_test.py' | grep -q .; then
            python -m pytest
          else
            echo "No Python tests found; skipping tests."
          fi
